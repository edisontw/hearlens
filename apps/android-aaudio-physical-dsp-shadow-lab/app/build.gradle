plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def targetAbis = (project.findProperty('targetAbis') ?: 'arm64-v8a')
    .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
def nativeOptimizationLevel = (project.findProperty('nativeOptimizationLevel') ?: '2')
    .toString()
if (!(nativeOptimizationLevel in ['0', '2'])) {
    throw new GradleException('nativeOptimizationLevel must be 0 or 2')
}

android {
    namespace 'org.hearlens.physicaldsp'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.hearlens.physicaldsp'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-research-dsp-shadow'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters(*targetAbis) }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Wpedantic -Werror'
                arguments '-DANDROID_STL=c++_static',
                    '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON',
                    "-DHEARLENS_NATIVE_OPT_LEVEL=${nativeOptimizationLevel}"
            }
        }
    }

    sourceSets {
        main { assets.srcDir("$buildDir/generated/mainAssets") }
        androidTest { assets.srcDir("$buildDir/generated/androidTestAssets") }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
