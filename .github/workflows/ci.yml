name: CI

on:
  push:
  pull_request:

jobs:
  web-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests and JavaScript syntax
        run: npm test
      - name: M04-D4 static nonhuman Android route/playback contract
        run: node --test tools/test-m04d4-native-bench.test.mjs
      - name: M04 output physical-evidence gate (NO PLAYBACK, always fail closed)
        run: |
          node --test tools/m04-output-safety-gate.test.mjs
          node tools/m04-output-safety-gate.mjs --evidence testdata/results/2026-10-16-m04-output-safety-state.json
      - name: M03 browser profile entry and import/export contract
        run: |
          node --test apps/web/audiogram-editor.test.mjs
          node --check apps/web/audiogram-editor.mjs
          node --check apps/web/audiogram-page.mjs
          cp packages/audiogram/audiogram.mjs apps/web/audiogram-domain.mjs
          node --input-type=module -e "import('./apps/web/audiogram-domain.mjs').then(m => { if (typeof m.normalizeAudiogramProfile !== 'function' || typeof m.deserializeAudiogramProfile !== 'function') process.exit(1) })"
          cmp -s packages/audiogram/audiogram.mjs apps/web/audiogram-domain.mjs
      - name: SW3 deterministic Bluetooth output no-PCM route policy report
        run: npm run report:sw3
      - name: SW2 deterministic causal DSP software-ceiling report
        run: npm run characterize:causal
      - name: SW2-B analytic phase, crossover, impulse and synthetic envelope report
        run: npm run characterize:phase
      - name: SW2 optional host-only causal-versus-STFT callback timing
        run: npm run benchmark:causal
      - name: Deterministic offline DSP research characterization
        run: npm run characterize:dsp
      - name: Dense synthetic crossover A/B report
        run: npm run characterize:crossover
      - name: Optional machine-dependent offline throughput probe
        run: npm run characterize:dsp -- --benchmark
      - name: Offline guarded streaming throughput (non-gating timing interpretation)
        run: npm run benchmark:stream
      - name: Offline callback buffer CPU and heap probe (non-gating timing interpretation)
        run: npm run benchmark:callback && node tools/benchmark-offline-callback.mjs 1 24000

  m03-camfit-direct-python-reference:
    name: M03 direct pinned Python CAMFIT cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-camfit-oracle.txt
      - name: Install reproducible Python numerical dependencies
        run: python -m pip install -r tools/requirements-camfit-oracle.txt
      - name: Run SHA-verified original PyClarity against JS across eight audiograms
        run: npm run verify:camfit:python
      - name: M04 offline acoustic WAV parser and lag-analysis correctness (NO PLAYBACK)
        run: python -m unittest discover -s tools -p 'test_m04_acoustic_wav.py' -v
      - name: M04 mono microphone chirp smoke synthetic controls (NO PLAYBACK)
        run: python -m unittest discover -s tools -p 'test_m04_mono_smoke.py' -v
