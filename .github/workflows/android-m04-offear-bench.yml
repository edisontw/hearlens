name: Android M04 Off-Ear Acoustic Bench
on:
  push:
    paths:
      - 'apps/android-acoustic-bench/**'
      - 'tools/test-m04d4-native-bench.test.mjs'
      - '.github/workflows/android-m04-offear-bench.yml'
  pull_request:
    paths:
      - 'apps/android-acoustic-bench/**'
      - 'tools/test-m04d4-native-bench.test.mjs'
      - '.github/workflows/android-m04-offear-bench.yml'
  workflow_dispatch:

jobs:
  android-m04-offear-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated nonhuman output policy
        run: node --test tools/test-m04d4-native-bench.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run offline Java route session fault tests
        run: |
          mkdir -p /tmp/hearlens-m04-bench
          javac -d /tmp/hearlens-m04-bench \
            apps/android-acoustic-bench/app/src/main/java/org/hearlens/acousticbench/BenchSessionGate.java \
            apps/android-acoustic-bench/tests/org/hearlens/acousticbench/BenchSessionGateTest.java
          java -cp /tmp/hearlens-m04-bench org.hearlens.acousticbench.BenchSessionGateTest
      - name: Compile standalone off-ear debug APK
        run: gradle --no-daemon -p apps/android-acoustic-bench assembleDebug
      - name: Name artifact distinctly from SW4 input-only tool
        run: |
          cp apps/android-acoustic-bench/app/build/outputs/apk/debug/app-debug.apk \
            apps/android-acoustic-bench/app/build/outputs/apk/debug/hearlens-m04d4-offear-v0.1.0-debug.apk
      - name: Publish debug APK only
        uses: actions/upload-artifact@v4
        with:
          name: hearlens-m04d4-offear-bench-debug
          path: apps/android-acoustic-bench/app/build/outputs/apk/debug/hearlens-m04d4-offear-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 14
