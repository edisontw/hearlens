name: Android SW1 Probe

on:
  push:
    paths:
      - 'apps/android-mic-probe/**'
      - 'tools/test-sw1-no-output.test.mjs'
      - '.github/workflows/android-sw1-probe.yml'
  pull_request:
    paths:
      - 'apps/android-mic-probe/**'
      - 'tools/test-sw1-no-output.test.mjs'
      - '.github/workflows/android-sw1-probe.yml'
  workflow_dispatch:

jobs:
  android-sw1-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce no-playback/no-network contract
        run: node --test tools/test-sw1-no-output.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu runner already has Android SDK cmdline-tools; avoid deprecated 'tools' installer.
      - name: Inspect runner-provided Android and Gradle toolchain
        run: |
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5
      - name: Execute JVM-only passive route audit fault matrix
        run: |
          mkdir -p /tmp/hearlens-route-audit-classes
          javac -d /tmp/hearlens-route-audit-classes \
            apps/android-mic-probe/app/src/main/java/org/hearlens/micprobe/PassiveRouteAudit.java \
            apps/android-mic-probe/tests/org/hearlens/micprobe/PassiveRouteAuditTest.java
          java -cp /tmp/hearlens-route-audit-classes org.hearlens.micprobe.PassiveRouteAuditTest
      - name: Execute JVM-only SW4 input timestamp and sample-clock fault matrix
        run: |
          mkdir -p /tmp/hearlens-input-clock-classes
          javac -d /tmp/hearlens-input-clock-classes apps/android-mic-probe/app/src/main/java/org/hearlens/micprobe/CaptureClockAudit.java apps/android-mic-probe/tests/org/hearlens/micprobe/CaptureClockAuditTest.java
          java -cp /tmp/hearlens-input-clock-classes org.hearlens.micprobe.CaptureClockAuditTest
      - name: Compile Android input-only debug APK
        run: gradle --no-daemon -p apps/android-mic-probe assembleDebug
      - name: Give the SW3 debug APK an unambiguous versioned filename
        run: cp apps/android-mic-probe/app/build/outputs/apk/debug/app-debug.apk apps/android-mic-probe/app/build/outputs/apk/debug/hearlens-sw4-input-clock-v0.4.0-debug.apk
      - name: Publish debug-signed (non-production) route observability APK
        uses: actions/upload-artifact@v4
        with:
          name: hearlens-sw4-input-clock-v0.4.0-diagnostics
          path: apps/android-mic-probe/app/build/outputs/apk/debug/hearlens-sw4-input-clock-v0.4.0-debug.apk
          if-no-files-found: error
          retention-days: 14
