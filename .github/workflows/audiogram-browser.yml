name: Web UI Chromium E2E

on:
  pull_request:
    paths:
      - "apps/web/audiogram*"
      - "apps/web/index.html"
      - "apps/web/main.js"
      - "apps/web/transcript-review.mjs"
      - "apps/web/stt-privacy.mjs"
      - "apps/web/styles.css"
      - "apps/web/caption-focus.mjs"
      - "apps/web/caption-size.mjs"
      - "apps/web/build.json"
      - "packages/audiogram/audiogram.mjs"
      - "tools/test-audiogram-browser.mjs"
      - "tools/test-caption-focus-browser.mjs"
      - ".github/workflows/audiogram-browser.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/audiogram*"
      - "apps/web/index.html"
      - "apps/web/main.js"
      - "apps/web/transcript-review.mjs"
      - "apps/web/stt-privacy.mjs"
      - "apps/web/styles.css"
      - "apps/web/caption-focus.mjs"
      - "apps/web/caption-size.mjs"
      - "apps/web/build.json"
      - "packages/audiogram/audiogram.mjs"
      - "tools/test-audiogram-browser.mjs"
      - "tools/test-caption-focus-browser.mjs"
      - ".github/workflows/audiogram-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-static-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Stage exactly the canonical audiogram domain module for Pages
        run: |
          cp packages/audiogram/audiogram.mjs apps/web/audiogram-domain.mjs
          cmp -s packages/audiogram/audiogram.mjs apps/web/audiogram-domain.mjs
      - name: Run real-browser static UI regressions (no microphone or output)
        run: |
          node tools/test-audiogram-browser.mjs
          node tools/test-caption-focus-browser.mjs
