name: Deploy Web Hearing Lab

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/audiogram/audiogram.mjs"
      - "testdata/audio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Include controlled regression audio
        run: |
          mkdir -p apps/web/testdata
          cp testdata/audio/hearlens-zh-tw-regression-v2.wav apps/web/testdata/
      - name: Stage canonical M03 audiogram validator
        run: cp packages/audiogram/audiogram.mjs apps/web/audiogram-domain.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
